<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <style>
      /* حالت شب از همان لحظهٔ اول (قبل از بارگذاری برنامه) تا صفحهٔ سفید دیده نشود */
      html.dark-boot, html.dark-boot body { background: #121417; color: #e8eaed; }
    </style>
    <script>
      try { if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark-boot'); } catch (e) {}
    </script>
  </head>
  <body>
    <script>
      try { if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark'); } catch (e) {}
    </script>
    <!-- Mount host only — App.vue owns the real #app shell. Nesting two #app
         nodes made #app{padding:20px} stick on the outer host while
         booking-page-active only cleared the inner one (left/right gutters). -->
    <div id="app-mount"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
